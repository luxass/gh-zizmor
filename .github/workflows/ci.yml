name: CI

permissions:
  contents: read

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

defaults:
  run:
    shell: bash --noprofile --norc -CeEuo pipefail {0}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: macos-latest
          - os: windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: install uv
        uses: astral-sh/setup-uv@eac588ad8def6316056a12d4907a9d4d84ff7a3b # v7.3.0

      - name: install zizmor
        run: |
          uv tool install zizmor

      - name: install gh-zizmor extension
        run: |
          gh extension install .
        env:
          GH_TOKEN: ${{ github.token }}

      - name: verify it works
        run: |
          gh zizmor --version

  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - file: secure-docker-build.yml
          - file: secure-example.yml
          - file: secure-release.yml

          - file: vulnerable-permissions.yml
          - file: vulnerable-script-injection.yml
          - file: vulnerable-secrets-exposure.yml
          - file: vulnerable-third-party-actions.yml
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: install uv
        uses: astral-sh/setup-uv@eac588ad8def6316056a12d4907a9d4d84ff7a3b # v7.3.0

      - name: install zizmor
        run: |
          uv tool install zizmor

      - name: install gh-zizmor extension
        run: |
          gh extension install .
        env:
          GH_TOKEN: ${{ github.token }}

      - name: verify it works
        run: |
          gh zizmor --version

      - name: run zizmor analysis
        env:
          FILE: ${{ matrix.file }}
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Analyzing $FILE..."
          gh zizmor ./workflow-tests/$FILE || echo "Analysis completed (vulnerabilities may have been found)"
